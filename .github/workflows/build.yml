name: Build Golden Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"


    - name: Install Android SDK
      uses: android-actions/setup-android@v3


    - name: Install Android packages
      run: |

        yes | sdkmanager --licenses || true

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "ndk;25.2.9519653"


    - name: Install build dependencies
      run: |

        python -m pip install --upgrade pip

        pip install \
          buildozer==1.5.0 \
          cython==0.29.33 \
          python-for-android==2024.1.21

        pip install \
          kivy==2.3.0 \
          kivymd==1.2.0


    - name: Configure Android environment
      run: |

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

        echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV

        echo "ANDROIDNDK=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV


    - name: Clean previous build
      run: |

        rm -rf .buildozer
        rm -rf bin


    - name: Build APK
      run: |

        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: Golden-Studio-APK

        path: bin/*.apk