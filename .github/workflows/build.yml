name: Build Golden Studio APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724"


      - name: Fix sdkmanager path
        run: |

          mkdir -p $ANDROID_HOME/tools/bin

          ln -sf \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          $ANDROID_HOME/tools/bin/sdkmanager


      - name: Set Android variables
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH


      - name: Install Linux dependencies
        run: |

          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake


      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install buildozer==1.5.0

          pip install cython==0.29.33

          pip install python-for-android==2024.01.21

          pip install kivy==2.3.0

          pip install kivymd==1.2.0


      - name: Clean Buildozer cache
        run: |

          rm -rf ~/.buildozer


      - name: Verify tools
        run: |

          python --version

          buildozer --version

          find $ANDROID_HOME -name sdkmanager

          find $ANDROID_HOME -name aidl


      - name: Build APK
        run: |

          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: golden-studio-apk

          path: bin/*.apk